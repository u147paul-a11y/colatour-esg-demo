<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>幸福里程碑｜可樂旅遊永續網站</title>
<style>
:root{--green:#174d32;--dark:#073428;--cream:#f7f6f0;--line:#d7d8cc}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#213a2d;background:var(--cream)}button,a{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.nav{height:72px;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 max(5%,calc((100% - 1200px)/2));box-shadow:0 2px 12px #0001}.nav img{height:43px;max-width:180px;object-fit:contain}.nav-links{display:flex;gap:24px;font-size:14px;font-weight:700;flex-wrap:wrap}.nav-links a[aria-current]{color:var(--green);border-bottom:3px solid var(--green);padding-bottom:7px}.hero{min-height:280px;display:flex;align-items:center;background:linear-gradient(90deg,#062f27db,#0a3b2640),url('image/main/01.avif') center 48%/cover;color:#fff}.hero-inner,.wrap{width:min(1200px,92%);margin:auto}.hero h1{font-size:clamp(36px,5vw,62px);letter-spacing:.08em;margin:0 0 10px}.hero p{font-size:22px;letter-spacing:.08em;margin:0}.content{padding:36px 0 90px}.topline{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.topline h2{margin:0;font-size:25px}.filters{display:flex;flex-wrap:wrap;gap:8px}.filter{border:1px solid var(--line);border-radius:24px;padding:9px 17px;background:transparent;color:#4c5e4e}.filter.active{background:var(--green);color:#fff;border-color:var(--green)}.timeline{display:grid;grid-template-columns:repeat(3,1fr);margin:44px 0 30px;position:relative}.timeline:before{content:"";position:absolute;top:38px;left:16.66%;right:16.66%;height:2px;background:#a8b7a8}.period{border:0;background:transparent;color:#6b746c;position:relative;padding:0 8px 18px;font-weight:700;font-size:17px}.period span{display:block;margin-bottom:14px}.period i{display:block;margin:auto;width:18px;height:18px;border-radius:50%;border:5px solid #a4a69a;background:#fff;position:relative;z-index:1}.period.active{color:var(--green)}.period.active i{border-color:#e2b924;background:var(--green);box-shadow:0 0 0 5px #1d623e55}.panel{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;align-items:start}.intro{padding:18px 0}.intro .years{font-size:36px;color:var(--green);font-family:Georgia,serif;margin:0 0 12px}.intro h3{font-size:26px;margin:0 0 18px}.intro p{color:#68796c;line-height:1.85}.cards-area{min-width:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{border:1px solid #e4e5dc;background:white;border-radius:13px;overflow:hidden;text-align:left;padding:0;box-shadow:0 6px 18px #1b3c2410;transition:transform .2s}.card:hover{transform:translateY(-3px)}.card-visual{height:146px;background:linear-gradient(125deg,#0d4b40,#82a79b);position:relative;overflow:hidden}.card-visual img{width:100%;height:100%;object-fit:cover;display:block}.card-year{position:absolute;left:12px;top:12px;background:#174d32e8;color:#fff;border:1px solid #ffffff7a;padding:5px 14px;border-radius:20px;font-size:13px}.card-category{position:absolute;left:12px;bottom:8px;background:#fff;color:var(--green);padding:4px 10px;border-radius:15px;font-size:12px}.card-bottom{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px;font-weight:700;min-height:58px}.arrow{border:1px solid #9cbaa6;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;flex:none}.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:19px}.controls button{border:1px solid #cad8cd;border-radius:50%;background:#fff;width:39px;height:39px}.controls button:disabled{opacity:.35;cursor:not-allowed}.status{font-size:13px;color:#647467}.empty{padding:70px 15px;text-align:center;border:1px dashed #cbd6ca;border-radius:12px;color:#607363}.dialog{border:0;border-radius:16px;max-width:850px;width:min(92vw,850px);padding:0;box-shadow:0 20px 80px #0005}.dialog::backdrop{background:#0009}.dialog-body{padding:34px}.dialog-top{display:flex;justify-content:space-between;align-items:start;gap:12px}.dialog-close{border:0;background:#edf1eb;border-radius:50%;font-size:24px;width:36px;height:36px}.dialog h2{font-size:30px;margin:8px 0 15px}.dialog p{line-height:1.9;color:#4f6356}.dialog .photo{width:100%;max-height:330px;object-fit:cover;border-radius:10px;margin-top:12px}.note{font-size:12px;color:#738277;margin-top:22px}.footer{background:#073428;color:#dbe9df;padding:25px 5%;font-size:12px;text-align:center}@media(max-width:800px){.nav{height:auto;min-height:68px;flex-wrap:wrap;padding:12px 4%}.nav-links{gap:12px;font-size:12px}.panel{grid-template-columns:1fr;gap:6px}.intro{padding:0}.intro .years{font-size:30px}.timeline{margin:32px 0 18px}.period{font-size:13px}.hero{min-height:240px}.cards{gap:10px}.card-visual{height:130px}}@media(max-width:480px){.cards{grid-template-columns:1fr}.card-visual{height:175px}.hero p{font-size:17px}}
</style>
</head>
<body>
<header class="nav"><a href="index.html"><img src="image/main/logo.png" alt="可樂旅遊"></a><nav class="nav-links" aria-label="主要選單"><a href="index.html">永續藍圖（首頁）</a><a href="milestones.html" aria-current="page">幸福里程碑</a><a href="index.html#story">永續旅遊</a><a href="index.html#commitment">永續承諾</a></nav></header>
<section class="hero"><div class="hero-inner"><h1>幸福里程碑</h1><p>我們走過的永續旅程</p></div></section>
<main class="content wrap"><div class="topline"><h2>❧ 永續旅程時間軸</h2><div class="filters" id="filters" aria-label="專案分類"></div></div><div class="timeline" id="timeline" aria-label="選擇永續旅程時期"></div><div class="panel"><aside class="intro"><div class="years" id="periodYears"></div><h3 id="periodTitle"></h3><p id="periodDesc"></p></aside><section class="cards-area" aria-label="永續專案"><div class="cards" id="cards"></div><div class="controls"><button id="prev" aria-label="上一組專案">‹</button><span class="status" id="status" aria-live="polite"></span><button id="next" aria-label="下一組專案">›</button></div><p class="note">展示版：專案資料與圖片請依公司核實資料更新；圖片若未上傳，卡片會顯示綠色底圖。</p></section></div></main>
<dialog class="dialog" id="detail"><div class="dialog-body"><div class="dialog-top"><div><small id="detailMeta"></small><h2 id="detailTitle"></h2></div><button class="dialog-close" id="close" aria-label="關閉視窗">×</button></div><p id="detailDesc"></p><img class="photo" id="detailImg" alt="" hidden></div></dialog>
<footer class="footer">© 2026 ColaTour Co., Ltd.｜永續網站 Demo</footer>
<script>
// 資料集中管理：日後新增專案，只要複製一筆物件並修改內容即可。
// 請把圖片放在 GitHub 的 image/milestones/ 資料夾，再填入對應路徑。
const periods=[
 {id:'early',years:'1998–2007',title:'奠定永續基礎',desc:'從旅行服務出發，逐步建立對環境、社會與旅遊品質的重視。此時期專案資料待補充。'},
 {id:'middle',years:'2008–2022',title:'朝永續目標邁進',desc:'持續推進永續行動，累積環境保育、社會參與與管理實踐。'},
 {id:'recent',years:'2023–至今',title:'永續轉型與深化',desc:'持續創新、深化永續旅遊與企業永續管理，讓負責任的旅行成為長期行動。'}
];
const projects=[
 {id:1,period:'middle',year:'2022',category:'生態保育',title:'啟動海洋保育行動',image:'image/milestones/ocean.jpg',desc:'依照參考設計圖建立的展示專案。請補上經確認的行動內容、合作單位與成果。'},
 {id:2,period:'recent',year:'2025',category:'地方共好',title:'推廣永續旅遊商品',image:'image/milestones/travel.jpg',desc:'依照參考設計圖建立的展示專案。請補上經確認的商品內容、合作對象與成果。'},
 {id:3,period:'recent',year:'2025',category:'低碳旅行',title:'完成公司碳盤查',image:'image/milestones/carbon.jpg',desc:'依照參考設計圖建立的展示專案。請補上經確認的盤查範圍與相關資訊。'},
 {id:4,period:'recent',year:'2025',category:'永續治理',title:'強化永續管理機制',image:'image/milestones/governance.jpg',desc:'依照參考設計圖建立的展示專案。請補上經確認的管理制度與推動成果。'}
];
// 參考圖把「2022 海洋保育」放在 2023–至今，但年份不符，這裡依年份歸入 2008–2022。
let current='recent',category='全部',page=0;const perPage=4;
const $=id=>document.getElementById(id);
function filtered(){return projects.filter(p=>p.period===current&&(category==='全部'||p.category===category));}
function render(){
 $('timeline').innerHTML=periods.map(p=>`<button class="period ${p.id===current?'active':''}" data-period="${p.id}" aria-pressed="${p.id===current}"><span>${p.years}</span><i></i></button>`).join('');
 const p=periods.find(p=>p.id===current);$('periodYears').textContent=p.years;$('periodTitle').textContent=p.title;$('periodDesc').textContent=p.desc;
 $('filters').innerHTML=['全部','低碳旅行','生態保育','地方共好','永續治理'].map(c=>`<button class="filter ${category===c?'active':''}" data-category="${c}" aria-pressed="${category===c}">${c}</button>`).join('');
 const data=filtered();const pages=Math.max(1,Math.ceil(data.length/perPage));page=Math.min(page,pages-1);
 $('cards').innerHTML=data.length?data.slice(page*perPage,(page+1)*perPage).map(p=>`<button class="card" data-id="${p.id}"><div class="card-visual"><img src="${p.image}" alt="" loading="lazy" onerror="this.style.display='none'"><span class="card-year">${p.year}</span><span class="card-category">${p.category}</span></div><div class="card-bottom"><span>${p.title}</span><span class="arrow">›</span></div></button>`).join(''):'<div class="empty">此時期／分類的專案內容尚待新增。</div>';
 $('status').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;
}
$('timeline').addEventListener('click',e=>{const b=e.target.closest('[data-period]');if(!b)return;current=b.dataset.period;page=0;render()});
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;category=b.dataset.category;page=0;render()});
$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};
$('cards').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const p=projects.find(p=>p.id===Number(b.dataset.id));$('detailMeta').textContent=`${p.year}　｜　${p.category}`;$('detailTitle').textContent=p.title;$('detailDesc').textContent=p.desc;const img=$('detailImg');img.hidden=false;img.src=p.image;img.onerror=()=>{img.hidden=true};$('detail').showModal()});
$('close').onclick=()=>$('detail').close();$('detail').addEventListener('click',e=>{if(e.target===$('detail'))$('detail').close()});render();
</script>
</body></html>
